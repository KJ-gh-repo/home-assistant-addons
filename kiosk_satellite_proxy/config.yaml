name: Kiosk Satellite Proxy
version: "2.1.0"
panel_icon: "mdi:tablet-dashboard"
panel_title: Kiosk Satellite
slug: kiosk-satellite-proxy
description: Access one or more Kiosk Satellite Remote Admin interfaces
url: "https://github.com/KJ-gh-repo/home-assistant-addons"
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:5001]/"
ingress: true
ingress_port: 5001
ingress_entry: /
panel_admin: false
ports:
  5001/tcp: null
ports_description:
  5001/tcp: Optional direct proxy port (Home Assistant ingress is recommended)
host_network: false
devices: []
usb: false
tmpfs: false
full_access: false
environment: {}
options:
  server: "http://ks-kiosk.local:2324"
  name: "Main kiosk"
  description: ""
  proxy_pass_host: false
  proxy_pass_real_ip: true
  additional_kiosks: []
schema:
  server: "match(^https?://.+$)"
  name: str
  description: str
  proxy_pass_host: bool
  proxy_pass_real_ip: bool
  additional_kiosks:
    - name: str
      description: str?
      server: "match(^https?://.+$)"
      path: "match(^[a-z0-9][a-z0-9-]*$)"
services: []
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map: []
